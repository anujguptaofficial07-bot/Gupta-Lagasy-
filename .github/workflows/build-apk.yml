name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repo root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP_FILE"

      - name: Unzip app
        run: |
          rm -rf app_source
          mkdir -p app_source
          unzip -q "$ZIP_FILE" -d app_source
          echo "ZIP extracted"

      - name: Find Android Gradle project
        run: |
          SETTINGS_FILE=$(find app_source -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found."
            echo "Showing files:"
            find app_source -maxdepth 4 -type f | head -n 80
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found at: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found."
            find "$PROJECT_DIR" -maxdepth 6 -type f -name "*.apk"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK found: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gupta-Legacy-VyaparAI-APK
          path: ${{ env.APK_FILE }}
